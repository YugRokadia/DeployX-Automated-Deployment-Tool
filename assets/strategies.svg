<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Animated blue-green, canary and rolling deployment strategies" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#151036"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <style>
    .t{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;text-anchor:middle}
    .h{font-size:17px;font-weight:700;fill:#f1f5f9}.s{font-size:12px;fill:#94a3b8}.b{font-size:12px;font-weight:700;fill:#e2e8f0}
    .flow{stroke-dasharray:6 5;animation:flow .8s linear infinite}@keyframes flow{to{stroke-dashoffset:-11}}
  </style>
  <rect width="1000" height="340" rx="16" fill="url(#bg)"/>
  <g fill="#0f172a" stroke="#334155" stroke-width="1.5">
    <rect x="20" y="20" width="300" height="300" rx="14"/><rect x="350" y="20" width="300" height="300" rx="14"/><rect x="680" y="20" width="300" height="300" rx="14"/>
  </g>

  <!-- Blue-green -->
  <g class="t">
    <text class="h" x="170" y="52">Blue-Green</text>
    <rect x="115" y="72" width="110" height="34" rx="8" fill="#1e293b" stroke="#a78bfa"/><text class="b" x="170" y="94">Nginx</text>
    <path class="flow" d="M150 106 L100 190" stroke="#38bdf8" stroke-width="3" fill="none"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="8s" repeatCount="indefinite"/></path>
    <path class="flow" d="M190 106 L240 190" stroke="#34d399" stroke-width="3" fill="none" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1" dur="8s" repeatCount="indefinite"/></path>
    <rect x="45" y="190" width="110" height="56" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"><animate attributeName="opacity" values="1;1;0.35;0.35;1" keyTimes="0;0.4;0.5;0.9;1" dur="8s" repeatCount="indefinite"/></rect>
    <text class="b" x="100" y="214">Blue</text><text class="s" x="100" y="232">current</text>
    <rect x="185" y="190" width="110" height="56" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2" opacity="0.35"><animate attributeName="opacity" values="0.35;0.35;1;1;0.35" keyTimes="0;0.4;0.5;0.9;1" dur="8s" repeatCount="indefinite"/></rect>
    <text class="b" x="240" y="214">Green</text><text class="s" x="240" y="232">new release</text>
    <text class="s" x="170" y="284">Two environments, traffic</text><text class="s" x="170" y="301">switches via Nginx</text>
  </g>

  <!-- Canary -->
  <g class="t">
    <text class="h" x="500" y="52">Canary</text>
    <rect x="445" y="72" width="110" height="34" rx="8" fill="#1e293b" stroke="#a78bfa"/><text class="b" x="500" y="94">Nginx</text>
    <rect x="380" y="130" width="240" height="14" rx="7" fill="#1e293b"/>
    <rect x="380" y="130" width="24" height="14" rx="7" fill="#34d399">
      <animate attributeName="width" values="24;24;96;96;168;168;240;240;24" keyTimes="0;0.12;0.2;0.37;0.45;0.62;0.7;0.9;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text class="s" x="500" y="168">share of traffic to canary</text>
    <rect x="380" y="190" width="110" height="56" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
    <text class="b" x="435" y="214">Stable</text><text class="s" x="435" y="232">current</text>
    <rect x="510" y="190" width="110" height="56" rx="10" fill="#064e3b" stroke="#34d399" stroke-width="2"><animate attributeName="stroke-width" values="2;4;2" dur="1.6s" repeatCount="indefinite"/></rect>
    <text class="b" x="565" y="214">Canary</text><text class="s" x="565" y="232">new release</text>
    <text class="s" x="500" y="284">Staged traffic shift</text><text class="s" x="500" y="301">to the new version</text>
  </g>

  <!-- Rolling -->
  <g class="t">
    <text class="h" x="830" y="52">Rolling</text>
    <text class="s" x="830" y="82">instances replaced one by one</text>
    <g stroke="#38bdf8" stroke-width="2">
      <rect x="700" y="120" width="50" height="70" rx="9" fill="#0c4a6e"><animate attributeName="fill" values="#0c4a6e;#0c4a6e;#064e3b;#064e3b;#0c4a6e" keyTimes="0;0.08;0.16;0.92;1" dur="9s" repeatCount="indefinite"/><animate attributeName="stroke" values="#38bdf8;#38bdf8;#34d399;#34d399;#38bdf8" keyTimes="0;0.08;0.16;0.92;1" dur="9s" repeatCount="indefinite"/></rect>
      <rect x="760" y="120" width="50" height="70" rx="9" fill="#0c4a6e"><animate attributeName="fill" values="#0c4a6e;#0c4a6e;#064e3b;#064e3b;#0c4a6e" keyTimes="0;0.24;0.32;0.92;1" dur="9s" repeatCount="indefinite"/><animate attributeName="stroke" values="#38bdf8;#38bdf8;#34d399;#34d399;#38bdf8" keyTimes="0;0.24;0.32;0.92;1" dur="9s" repeatCount="indefinite"/></rect>
      <rect x="820" y="120" width="50" height="70" rx="9" fill="#0c4a6e"><animate attributeName="fill" values="#0c4a6e;#0c4a6e;#064e3b;#064e3b;#0c4a6e" keyTimes="0;0.4;0.48;0.92;1" dur="9s" repeatCount="indefinite"/><animate attributeName="stroke" values="#38bdf8;#38bdf8;#34d399;#34d399;#38bdf8" keyTimes="0;0.4;0.48;0.92;1" dur="9s" repeatCount="indefinite"/></rect>
      <rect x="880" y="120" width="50" height="70" rx="9" fill="#0c4a6e"><animate attributeName="fill" values="#0c4a6e;#0c4a6e;#064e3b;#064e3b;#0c4a6e" keyTimes="0;0.56;0.64;0.92;1" dur="9s" repeatCount="indefinite"/><animate attributeName="stroke" values="#38bdf8;#38bdf8;#34d399;#34d399;#38bdf8" keyTimes="0;0.56;0.64;0.92;1" dur="9s" repeatCount="indefinite"/></rect>
    </g>
    <text class="s" x="725" y="212">v1<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.08;0.16;0.92;1" dur="9s" repeatCount="indefinite"/></text><text class="s" x="725" y="212" fill="#34d399" opacity="0">v2<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.08;0.16;0.92;1" dur="9s" repeatCount="indefinite"/></text><text class="s" x="785" y="212">v1<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.24;0.32;0.92;1" dur="9s" repeatCount="indefinite"/></text><text class="s" x="785" y="212" fill="#34d399" opacity="0">v2<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.24;0.32;0.92;1" dur="9s" repeatCount="indefinite"/></text><text class="s" x="845" y="212">v1<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.48;0.92;1" dur="9s" repeatCount="indefinite"/></text><text class="s" x="845" y="212" fill="#34d399" opacity="0">v2<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.48;0.92;1" dur="9s" repeatCount="indefinite"/></text><text class="s" x="905" y="212">v1<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.56;0.64;0.92;1" dur="9s" repeatCount="indefinite"/></text><text class="s" x="905" y="212" fill="#34d399" opacity="0">v2<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.56;0.64;0.92;1" dur="9s" repeatCount="indefinite"/></text>
    <circle cx="725" cy="150" r="4" fill="#fff" opacity="0.8"><animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/></circle>
    <text class="s" x="830" y="284">Old instances swapped</text><text class="s" x="830" y="301">for new ones in turn</text>
  </g>
</svg>
