<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Animated pipeline DAG: Trigger, Clone, Build, parallel Test and Image, Deploy, Health check" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#151036"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="p1" d="M140 140 L180 140"/><path id="p2" d="M300 140 L340 140"/>
    <path id="p3" d="M460 140 C490 140 490 75 520 75"/><path id="p4" d="M460 140 C490 140 490 205 520 205"/>
    <path id="p5" d="M640 75 C670 75 670 140 700 140"/><path id="p6" d="M640 205 C670 205 670 140 700 140"/>
    <path id="p7" d="M820 140 L860 140"/>
  </defs>
  <style>
    .t{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;text-anchor:middle}
    .n{font-size:15px;font-weight:700;fill:#f1f5f9}.s{font-size:11px;fill:#94a3b8}
    .edge{stroke:#475569;stroke-width:2;fill:none;stroke-dasharray:6 6;animation:flow .9s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-12}}
  </style>
  <rect width="1000" height="300" rx="16" fill="url(#bg)"/>
  <text class="t" x="500" y="34" font-size="13" font-weight="700" letter-spacing="2" fill="#a78bfa">PIPELINE DAG EXECUTION</text>

  <g>
    <use href="#p1" class="edge"/><use href="#p2" class="edge"/><use href="#p3" class="edge"/><use href="#p4" class="edge"/>
    <use href="#p5" class="edge"/><use href="#p6" class="edge"/><use href="#p7" class="edge"/>
  </g>

  <!-- packets: one 10s cycle, each edge fires when its source stage completes -->
  <g fill="#22d3ee" filter="url(#glow)">
    <circle r="4.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.09;0.1;1" dur="10s" begin="0s" repeatCount="indefinite"/><animateMotion dur="10s" begin="0s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.1;1" calcMode="linear"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.09;0.1;1" dur="10s" begin="1s" repeatCount="indefinite"/><animateMotion dur="10s" begin="1s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.1;1" calcMode="linear"><mpath href="#p2"/></animateMotion></circle>
    <circle r="4.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.09;0.1;1" dur="10s" begin="2s" repeatCount="indefinite"/><animateMotion dur="10s" begin="2s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.1;1" calcMode="linear"><mpath href="#p3"/></animateMotion></circle>
    <circle r="4.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.09;0.1;1" dur="10s" begin="2s" repeatCount="indefinite"/><animateMotion dur="10s" begin="2s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.1;1" calcMode="linear"><mpath href="#p4"/></animateMotion></circle>
    <circle r="4.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.09;0.1;1" dur="10s" begin="3s" repeatCount="indefinite"/><animateMotion dur="10s" begin="3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.1;1" calcMode="linear"><mpath href="#p5"/></animateMotion></circle>
    <circle r="4.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.09;0.1;1" dur="10s" begin="3s" repeatCount="indefinite"/><animateMotion dur="10s" begin="3s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.1;1" calcMode="linear"><mpath href="#p6"/></animateMotion></circle>
    <circle r="4.5" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.09;0.1;1" dur="10s" begin="4s" repeatCount="indefinite"/><animateMotion dur="10s" begin="4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.1;1" calcMode="linear"><mpath href="#p7"/></animateMotion></circle>
  </g>

  <!-- stages -->
  <g stroke-width="2.5" fill="#0f172a">
    <rect x="20" y="112" width="120" height="56" rx="12" stroke="#334155"><animate attributeName="stroke" values="#334155;#22d3ee;#34d399;#34d399;#334155" keyTimes="0;0.08;0.2;0.9;1" dur="10s" begin="0s" repeatCount="indefinite"/></rect>
    <rect x="180" y="112" width="120" height="56" rx="12" stroke="#334155"><animate attributeName="stroke" values="#334155;#22d3ee;#34d399;#34d399;#334155" keyTimes="0;0.08;0.2;0.9;1" dur="10s" begin="1s" repeatCount="indefinite"/></rect>
    <rect x="340" y="112" width="120" height="56" rx="12" stroke="#334155"><animate attributeName="stroke" values="#334155;#22d3ee;#34d399;#34d399;#334155" keyTimes="0;0.08;0.2;0.9;1" dur="10s" begin="2s" repeatCount="indefinite"/></rect>
    <rect x="520" y="47" width="120" height="56" rx="12" stroke="#334155"><animate attributeName="stroke" values="#334155;#22d3ee;#34d399;#34d399;#334155" keyTimes="0;0.08;0.2;0.9;1" dur="10s" begin="3s" repeatCount="indefinite"/></rect>
    <rect x="520" y="177" width="120" height="56" rx="12" stroke="#334155"><animate attributeName="stroke" values="#334155;#22d3ee;#34d399;#34d399;#334155" keyTimes="0;0.08;0.2;0.9;1" dur="10s" begin="3s" repeatCount="indefinite"/></rect>
    <rect x="700" y="112" width="120" height="56" rx="12" stroke="#334155"><animate attributeName="stroke" values="#334155;#22d3ee;#34d399;#34d399;#334155" keyTimes="0;0.08;0.2;0.9;1" dur="10s" begin="4s" repeatCount="indefinite"/></rect>
    <rect x="860" y="112" width="120" height="56" rx="12" stroke="#334155"><animate attributeName="stroke" values="#334155;#22d3ee;#34d399;#34d399;#334155" keyTimes="0;0.08;0.2;0.9;1" dur="10s" begin="5s" repeatCount="indefinite"/></rect>
  </g>
  <g class="t">
    <text class="n" x="80" y="137">Trigger</text><text class="s" x="80" y="155">webhook · cron</text>
    <text class="n" x="240" y="137">Clone</text><text class="s" x="240" y="155">fetch source</text>
    <text class="n" x="400" y="137">Build</text><text class="s" x="400" y="155">compile</text>
    <text class="n" x="580" y="72">Test</text><text class="s" x="580" y="90">parallel task</text>
    <text class="n" x="580" y="202">Image</text><text class="s" x="580" y="220">container build</text>
    <text class="n" x="760" y="137">Deploy</text><text class="s" x="760" y="155">chosen strategy</text>
    <text class="n" x="920" y="137">Health</text><text class="s" x="920" y="155">self-healing</text>
    <text class="s" x="500" y="278" font-size="12">Illustrative DAG: tasks start as soon as their dependencies finish</text>
  </g>
</svg>
