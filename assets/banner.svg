<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="DeployX - Cloud-native CI/CD platform" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#1b1145"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <path id="e1" d="M860 170 L950 95"/><path id="e2" d="M860 170 L950 245"/>
    <path id="e3" d="M950 95 L1040 170"/><path id="e4" d="M950 245 L1040 170"/>
    <path id="e5" d="M1040 170 L1130 170"/>
  </defs>
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <circle cx="1000" cy="170" r="230" fill="url(#halo)"><animate attributeName="r" values="210;250;210" dur="6s" repeatCount="indefinite"/></circle>

  <!-- floating particles -->
  <g fill="#22d3ee" opacity="0.5">
    <circle cx="120" cy="300" r="2"><animate attributeName="cy" values="300;40;300" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="320" r="1.6"><animate attributeName="cy" values="320;60;320" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="310" r="2.2"><animate attributeName="cy" values="310;30;310" dur="16s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="300" r="1.8"><animate attributeName="cy" values="300;50;300" dur="12s" repeatCount="indefinite"/></circle>
  </g>

  <!-- live pill -->
  <rect x="60" y="42" width="190" height="30" rx="15" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.45"/>
  <circle cx="82" cy="57" r="5" fill="#34d399"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="96" y="62" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.4" fill="#cbd5e1">LIVE ON VERCEL</text>

  <!-- title -->
  <g font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
    <text x="58" y="158" font-size="92" font-weight="800" fill="url(#accent)" filter="url(#glow)">DeployX<animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/></text>
    <text x="62" y="204" font-size="27" font-weight="600" fill="#e2e8f0">Cloud-native CI/CD platform<animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="1.2s" fill="freeze"/></text>
    <text x="62" y="240" font-size="16" fill="#94a3b8">YAML pipelines · DAG execution · Multi-strategy deployments<animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="1.2s" fill="freeze"/></text>
    <text x="62" y="264" font-size="16" fill="#94a3b8">Self-healing · Real-time observability<animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="1.2s" fill="freeze"/></text>
  </g>
  <rect x="62" y="290" height="4" rx="2" fill="url(#accent)"><animate attributeName="width" values="0;240;240" keyTimes="0;0.4;1" dur="3.5s" fill="freeze"/></rect>

  <!-- animated DAG -->
  <g stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="6 6">
    <use href="#e1"><animate attributeName="stroke-dashoffset" values="12;0" dur="0.9s" repeatCount="indefinite"/></use>
    <use href="#e2"><animate attributeName="stroke-dashoffset" values="12;0" dur="0.9s" repeatCount="indefinite"/></use>
    <use href="#e3"><animate attributeName="stroke-dashoffset" values="12;0" dur="0.9s" repeatCount="indefinite"/></use>
    <use href="#e4"><animate attributeName="stroke-dashoffset" values="12;0" dur="0.9s" repeatCount="indefinite"/></use>
    <use href="#e5"><animate attributeName="stroke-dashoffset" values="12;0" dur="0.9s" repeatCount="indefinite"/></use>
  </g>
  <g fill="#22d3ee" filter="url(#glow)">
    <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#e1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite"><mpath href="#e2"/></animateMotion></circle>
    <circle r="4" fill="#a78bfa"><animateMotion dur="2.4s" begin="0.9s" repeatCount="indefinite"><mpath href="#e3"/></animateMotion></circle>
    <circle r="4" fill="#a78bfa"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#e4"/></animateMotion></circle>
    <circle r="4" fill="#34d399"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#e5"/></animateMotion></circle>
  </g>
  <g fill="#0f172a" stroke="url(#accent)" stroke-width="2.5">
    <circle cx="860" cy="170" r="20"/><circle cx="950" cy="95" r="20"/><circle cx="950" cy="245" r="20"/>
    <circle cx="1040" cy="170" r="20"/><circle cx="1130" cy="170" r="20"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="860" cy="170" r="6"><animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="95" r="6"><animate attributeName="r" values="4;8;4" dur="2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="245" r="6"><animate attributeName="r" values="4;8;4" dur="2s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="170" r="6"><animate attributeName="r" values="4;8;4" dur="2s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="170" r="6" fill="#34d399"><animate attributeName="r" values="4;8;4" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
