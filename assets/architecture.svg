<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="DeployX architecture: GitHub, web dashboard, Supabase, runner agent, Docker and Nginx, deploy targets" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset="1" stop-color="#151036"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <path id="a1" d="M140 150 L180 150"/><path id="a2" d="M310 150 L350 150"/><path id="a3" d="M650 150 L690 150"/><path id="a4" d="M820 150 L860 150"/>
    <path id="a5" d="M480 150 L520 150"/>
  </defs>
  <style>
    .t{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;text-anchor:middle}
    .n{font-size:13.5px;font-weight:700;fill:#f1f5f9}.s{font-size:11.5px;fill:#94a3b8}
    .edge{stroke:#a78bfa;stroke-width:2;fill:none;stroke-dasharray:6 5;animation:flow .9s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-11}}
  </style>
  <rect width="1000" height="360" rx="16" fill="url(#bg)"/>
  <text class="t" x="500" y="38" font-size="13" font-weight="700" letter-spacing="2" fill="#a78bfa">ARCHITECTURE</text>

  <use href="#a1" class="edge" marker-end="url(#arr)"/>
  <use href="#a2" class="edge" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <use href="#a5" class="edge" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <use href="#a3" class="edge" marker-end="url(#arr)"/>
  <use href="#a4" class="edge" marker-end="url(#arr)"/>

  <g fill="#22d3ee" filter="url(#glow)">
    <circle r="4"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#a1"/></animateMotion></circle>
    <circle r="4" fill="#a78bfa"><animateMotion dur="2.2s" begin="0.5s" repeatCount="indefinite"><mpath href="#a2"/></animateMotion></circle>
    <circle r="4" fill="#a78bfa"><animateMotion dur="2.2s" begin="1.0s" repeatCount="indefinite"><mpath href="#a5"/></animateMotion></circle>
    <circle r="4" fill="#34d399"><animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite"><mpath href="#a3"/></animateMotion></circle>
    <circle r="4" fill="#34d399"><animateMotion dur="2.2s" begin="1.8s" repeatCount="indefinite"><mpath href="#a4"/></animateMotion></circle>
  </g>

  <g fill="#0f172a" stroke="url(#accent)" stroke-width="2">
    <rect x="10" y="100" width="130" height="100" rx="14"/><rect x="180" y="100" width="130" height="100" rx="14"/>
    <rect x="350" y="100" width="130" height="100" rx="14"/><rect x="520" y="100" width="130" height="100" rx="14"/>
    <rect x="690" y="100" width="130" height="100" rx="14"/><rect x="860" y="100" width="130" height="100" rx="14"/>
  </g>
  <g class="t">
    <text class="n" x="75" y="137">GitHub</text><text class="s" x="75" y="158">push webhooks</text><text class="s" x="75" y="175">OAuth sign-in</text>
    <text class="n" x="245" y="137">Web Dashboard</text><text class="s" x="245" y="158">Next.js 16</text><text class="s" x="245" y="175">Vercel</text>
    <text class="n" x="415" y="137">Supabase</text><text class="s" x="415" y="158">Postgres · Auth</text><text class="s" x="415" y="175">Realtime · Storage</text>
    <text class="n" x="585" y="137">Runner Agent</text><text class="s" x="585" y="158">Node.js CLI</text><text class="s" x="585" y="175">clone · build · deploy</text>
    <text class="n" x="755" y="137">Docker + Nginx</text><text class="s" x="755" y="158">container build</text><text class="s" x="755" y="175">reverse proxy</text>
    <text class="n" x="925" y="137">Targets</text><text class="s" x="925" y="158">Docker Local</text><text class="s" x="925" y="175">Railway · Fly.io</text>
  </g>

  <!-- shared packages -->
  <rect x="180" y="250" width="470" height="76" rx="14" fill="none" stroke="#475569" stroke-dasharray="5 5"/>
  <text class="t s" x="415" y="272" font-size="11" letter-spacing="1.5">SHARED PACKAGES (TURBOREPO + PNPM)</text>
  <g class="t" font-size="12">
    <rect x="200" y="284" width="130" height="30" rx="8" fill="#1e293b"/><text class="s" x="265" y="304" fill="#e2e8f0">shared</text>
    <rect x="350" y="284" width="130" height="30" rx="8" fill="#1e293b"/><text class="s" x="415" y="304" fill="#e2e8f0">pipeline-engine</text>
    <rect x="500" y="284" width="130" height="30" rx="8" fill="#1e293b"/><text class="s" x="565" y="304" fill="#e2e8f0">ui</text>
  </g>
  <path class="edge" d="M245 250 L245 200" stroke-opacity="0.6"/>
  <path class="edge" d="M585 250 L585 200" stroke-opacity="0.6"/>
</svg>
